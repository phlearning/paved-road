name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Install ansible-lint
        run: pipx install --include-deps ansible-lint
      - name: Install Ansible collections
        run: cd ansible && ansible-galaxy collection install -r requirements.yml -p ./collections
      - run: make lint

  security:
    name: Scan configuration (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan Terraform, Kubernetes manifests and Dockerfiles
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL .
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Scan the shared service chart with every capability enabled
        # helm template includes hook resources (jobs), which a chart scan skips.
        run: |
          mkdir -p rendered
          helm template scan platform/charts/service \
            -f platform/charts/service/ci/scan-values.yaml > rendered/service.yaml
          docker run --rm -v "$PWD/rendered:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL .

  platformctl:
    name: Test platformctl and the shared chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: make test

  discover:
    name: Find changed services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: List services changed by this push or pull request
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          shopt -s nullglob
          all=$(for f in apps/*/service.yaml; do basename "$(dirname "$f")"; done | sort)
          full=false
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            full=true
          fi
          changed=""
          for s in $all; do
            # A service is rebuilt when its directory or one of its build.watch
            # paths (relative to the repository root) changes.
            mapfile -t paths < <(echo "apps/$s"; yq '.build.watch[]' "apps/$s/service.yaml" 2>/dev/null)
            if $full || [[ -n "$(git diff --name-only "$BASE" HEAD -- "${paths[@]}")" ]]; then
              changed="$changed $s"
            fi
          done
          services=$(for s in $changed; do yq -o=json '{"name": .name, "language": .language}' "apps/$s/service.yaml"; done | jq -sc .)
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Changed services: $services"

  service:
    name: Build ${{ matrix.service.name }}
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service.name }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.service.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: matrix.service.language == 'python'
        name: Test (Python)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - if: matrix.service.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/${{ matrix.service.name }}/go.mod
          cache-dependency-path: apps/${{ matrix.service.name }}/go.sum
      - if: matrix.service.language == 'go'
        name: Test (Go)
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image for scanning (amd64)
        run: |
          image="$(yq '.image.repository' values.yaml):${GITHUB_SHA::12}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          # build.context (relative to the service) lets a service ship files
          # from elsewhere in the repository, such as docs/.
          echo "CONTEXT=$(yq '.build.context // "."' service.yaml)" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load -t "$image" -f Dockerfile \
            --cache-from "type=gha,scope=${{ matrix.service.name }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service.name }}" \
            "$(yq '.build.context // "."' service.yaml)"

      - name: Scan the image for fixable vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"

      - if: github.event_name == 'push'
        name: Push the image for amd64 and arm64
        # Laptops are often arm64 (Apple Silicon) while CI and servers are
        # amd64. The amd64 layers come from the cache of the scanned build.
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$IMAGE" -f Dockerfile \
            --cache-from "type=gha,scope=${{ matrix.service.name }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service.name }}" \
            "$CONTEXT"

  release:
    name: Point Argo CD at the new images
    needs: [discover, service]
    if: github.event_name == 'push' && needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit the new image tags
        env:
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          for name in $(jq -r '.[].name' <<<"$SERVICES"); do
            yq -i ".image.tag = \"${GITHUB_SHA::12}\"" "apps/$name/values.yaml"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${GITHUB_SHA::12}: $(jq -r 'map(.name) | join(", ")' <<<"$SERVICES")"
          # Another release may have landed meanwhile; tags of other services are untouched.
          git pull --rebase
          # Pushes made with GITHUB_TOKEN do not trigger a new workflow run.
          git push

  e2e:
    name: End-to-end (lite profile)
    needs: [lint, security, platformctl]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bootstrap the runner with Ansible
        run: make bootstrap PROFILE=lite
      - name: Create the cluster and install the platform
        # Services are imported into k3d by the e2e script: no registry or
        # repository credentials are needed.
        run: make up REQUIRE_TOKENS=0
      - name: Run the golden path end to end
        run: make e2e
      - name: Dump the cluster state
        if: failure()
        run: |
          export KUBECONFIG=$PWD/.kube/config
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
