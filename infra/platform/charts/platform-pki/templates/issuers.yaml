# Bootstraps a self-signed root CA, then exposes it as a ClusterIssuer:
# services request certificates from the CA, never from the self-signed issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer }}-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.rootSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ .Values.rootCommonName | quote }}
  subject:
    organizations:
      - paved-road
  secretName: {{ .Values.rootSecretName }}
  duration: {{ .Values.rootDuration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ .Values.clusterIssuer }}-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer }}
spec:
  ca:
    secretName: {{ .Values.rootSecretName }}
