# Shared model server: services call http://ollama.ai.svc:11434 instead of
# each shipping their own LLM runtime.
fullnameOverride: ollama

ollama:
  models:
    pull:
      - qwen3:1.7b

persistentVolume:
  enabled: true
  size: 6Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 4Gi
