---
# Prepares the developer workstation: installs the platform toolchain, makes
# sure a container runtime is running and picks a resource profile.
- name: Prepare workstation for paved-road
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/toolchain.yml

  vars:
    # Hosts with less memory get the lite profile (see docs/adr/0004).
    full_profile_min_memory_mb: 15000
    detected_profile: "{{ 'full' if ansible_facts['memtotal_mb'] >= full_profile_min_memory_mb else 'lite' }}"
    paved_road_profile: "{{ profile | default(detected_profile, true) }}"

  handlers:
    - name: Load Debian handlers
      ansible.builtin.import_tasks: handlers/debian.yml

  tasks:
    - name: Fail on unsupported operating systems
      ansible.builtin.assert:
        that: ansible_facts['os_family'] in ['Darwin', 'Debian']
        fail_msg: "Supported systems: macOS, Debian, Ubuntu (including WSL2)."

    - name: Fail on unknown profiles
      ansible.builtin.assert:
        that: paved_road_profile in ['full', 'lite']
        fail_msg: "profile must be 'full' or 'lite', got '{{ paved_road_profile }}'."

    - name: Set up macOS
      ansible.builtin.include_tasks: tasks/darwin.yml
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Set up Debian and Ubuntu
      ansible.builtin.include_tasks: tasks/debian.yml
      when: ansible_facts['os_family'] == 'Debian'

    - name: Record the resource profile for make
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../.paved-road.env"
        content: "PROFILE={{ paved_road_profile }}\n"
        mode: "0644"

    - name: Show the selected profile
      ansible.builtin.debug:
        msg: >-
          Profile '{{ paved_road_profile }}' selected
          ({{ ansible_facts['memtotal_mb'] }} MB of RAM detected).
          Override with 'make bootstrap PROFILE=full|lite'.
