# Defaults of the golden path. A service overrides them in apps/<name>/values.yaml.

# Service name, also used for the namespace, the hostname and the dashboard.
name: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

# Port the container listens on.
port: 8080

# Extra environment variables, as a list of EnvVar objects.
env: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  liveness: /healthz
  readiness: /readyz

ingress:
  enabled: true
  # Defaults to <name>.localhost.
  host: ""
  clusterIssuer: paved-road-ca

metrics:
  enabled: true
  path: /metrics
  interval: 30s

dashboard:
  enabled: true
  # Extra panels appended to the standard dashboard. "$namespace" in expr is
  # replaced by the service namespace.
  # - title: Queue depth
  #   expr: sum(queue_depth{namespace="$namespace"})
  #   unit: short          # Grafana unit: s, bytes, reqps, percentunit...
  #   legend: "{{queue}}"
  panels: []

# Self-service PostgreSQL, run by the CloudNativePG operator. The connection
# string reaches the service (and its jobs) as DATABASE_URL.
postgres:
  enabled: false
  instances: 1
  storage: 1Gi
  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # Extensions created in the database, for example [vector].
  extensions: []

# Jobs run with the service image after every successful deployment
# (Helm post-install/post-upgrade hooks, PostSync in Argo CD).
# - name: migrate
#   args: ["python", "-m", "app.migrate"]
jobs: []

# Secrets sealed with `platformctl seal`: KEY -> ciphertext. They reach the
# service as environment variables; only this cluster can decrypt them.
secrets: {}
